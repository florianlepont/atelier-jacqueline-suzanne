name: Deploy to OVH production

# This is the ONLY path that ever writes to the real production domain,
# atelierjacquelinesuzanne.fr, served from OVH Web Hosting. It starts
# automatically when the single Sanity webhook (configured per README.md
# "Sanity webhook") fires the `production-deploy-requested`
# repository_dispatch event on any publish, unpublish or delete of a public
# document. Those runs use the reviewer-free `production-ovh-auto`
# environment below, because Romane's own click on Sanity's native Publier
# button is the deliberate act. Manual `workflow_dispatch` runs use the
# reviewer-gated `production-ovh` environment and still pause for a
# recorded human approval (D-02).
#
# A push to `main` never runs this workflow: .github/workflows/ci.yml only
# gates every push. This workflow also ships the self-hosted Sanity Studio
# (https://atelierjacquelinesuzanne.fr/studio) alongside the site.
#
# Because `repository_dispatch` always runs against the default branch, a
# publish also ships whatever code is currently on `main` — keep `main`
# production-ready (ci.yml gates every push to it).
#
# The `deploy` job below is gated on a trigger-conditional GitHub
# Environment. With a Required reviewer configured on `production-ovh`,
# GitHub pauses manual runs after the `build` job's recap is printed and
# requires a recorded human approval before the SFTP push can happen
# (D-02); `production-ovh-auto` carries no such gate. See README.md
# "Deployments" section for the one-time setup and the run procedure.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [production-deploy-requested]

permissions:
  contents: read

# Only one production push should ever be in flight/queued — two
# interleaved pushes to the same remote directory would race. This
# `ovh-production` group with `cancel-in-progress: false` also serialises
# automatic runs: a burst of publishes leaves at most one running and one
# pending run, and the most recent pending run wins — the desired
# latest-content-wins behaviour.
concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same gates as ci.yml (production never skips a gate): Studio
      # lint/test:coverage/build, Studio typecheck, root lint, and root
      # typecheck all run here too.
      - name: Install dependencies, lint, and type-check
        uses: ./.github/actions/lint-typecheck-and-install

      # Production build: root base path (OVH serves the domain root, so
      # the base-path override must stay UNSET here — setting it would make
      # every baked href/asset path wrong on the real domain) and an
      # explicit SITE_URL pointing at the real domain. A missing SITE_URL
      # here is the failure mode that silently ships canonical tags,
      # hreflang links, sitemap.xml, and robots.txt all pointing at the
      # wrong host. The contact endpoint override is deliberately left
      # UNSET too: production is same-origin with contact.php, so the
      # contact-form helper's default (/contact.php) is already correct.
      - name: Build (OVH production artifact, root base)
        run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SITE_URL: https://atelierjacquelinesuzanne.fr

      # BLOCKING gate: proves the root-base artifact is well-formed, and
      # (per 05-01-PLAN.md) also proves dist/contact.php and the hardened
      # dist/.htaccess shipped with matching honeypot field names.
      - name: Verify static artifact
        run: npm run test:artifact

      # BLOCKING gates: the same e2e and unit-test gates as ci.yml.
      - name: Playwright e2e and Vitest coverage
        uses: ./.github/actions/e2e-and-unit-tests

      # The SFTP step below uploads dotfiles by explicit name (see the
      # "Deploy .htaccess" step in the deploy job), because a shell glob
      # like ./dist/* silently skips them. This guard turns "a new
      # top-level dotfile appeared and would be silently dropped from
      # production" into a loud build failure instead of a silent gap.
      - name: 'Guard: only .htaccess is a top-level dotfile'
        run: |
          dotfiles=$(find dist -maxdepth 1 -mindepth 1 -name '.*' -printf '%f\n' | sort)
          expected='.htaccess'
          if [ "$dotfiles" != "$expected" ]; then
            echo "::error::Expected dist/ to contain exactly one top-level dotfile (.htaccess), found: $(echo "$dotfiles" | tr '\n' ' ')" >&2
            exit 1
          fi

      # This recap is what a human reads before approving a manual run's
      # `deploy` job environment gate (D-02) — it is already visible in
      # the same run, above the Approve/Reject button.
      - name: Deploy recap
        run: |
          {
            echo "## OVH production deploy recap"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA}\` — $(git log -1 --pretty=%s)"
            echo "- **SFTP target:** read from the OVH_SFTP_HOST and OVH_SFTP_USER repository variables (not printed here)"
            echo "- **Resolved SITE_URL:** \`https://atelierjacquelinesuzanne.fr\`"
            echo "- **File count:** $(find dist -type f | wc -l)"
            echo "- **Total size:** $(du -sh dist | cut -f1)"
            echo ""
            echo "### Top-level dist/ entries"
            echo '```'
            ls -1a dist
            echo '```'
            echo ""
            if [ -f dist/contact.php ]; then
              echo "- dist/contact.php: present"
            else
              echo "- dist/contact.php: **MISSING**"
            fi
            if [ -f dist/.htaccess ]; then
              echo "- dist/.htaccess: present"
            else
              echo "- dist/.htaccess: **MISSING**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2.4+ excludes hidden files by default.
      # Without include-hidden-files: true, dist/.htaccess never even
      # reaches the deploy job, and production ships with no Apache
      # config (no ErrorDocument, no Options -Indexes, no HTTPS redirect).
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovh-dist
          path: dist
          include-hidden-files: true

      # The Studio is self-hosted under /studio (www/studio on OVH). It was
      # already built by the shared gates above (`sanity build`, basePath
      # /studio); its Apache config ships as dist/.htaccess so the SFTP
      # steps below can send it by explicit name, like the site's.
      - name: Prepare Studio artifact
        run: |
          test -f sanity/dist/index.html
          cp sanity/studio.htaccess sanity/dist/.htaccess

      - name: Upload Studio artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovh-studio-dist
          path: sanity/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub environment protection rules are a property of the
    # environment, not the job, so a conditional approval gate requires
    # two environments: `production-ovh` carries the Required reviewer
    # and gates manual runs (D-02), while `production-ovh-auto` is
    # deliberately created with no protection rules so Sanity-publish
    # runs deploy straight through. Environment secrets do not cross
    # environments, so `OVH_SFTP_PASSWORD` must exist on BOTH (see
    # README.md "Deployments").
    environment:
      name: ${{ github.event_name == 'repository_dispatch' && 'production-ovh-auto' || 'production-ovh' }}
      url: https://atelierjacquelinesuzanne.fr
    steps:
      # Without this, a missing environment secret or repository variable
      # resolves to an empty string and the SFTP action attempts a broken or
      # unauthenticated connection, producing an opaque failure. This turns
      # that into a loud, actionable one before any upload is attempted. The
      # SFTP host and account name live in repository variables (not in this
      # tracked file); only their NAMES are ever printed, never their values.
      - name: 'Guard: SFTP credentials are present'
        env:
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ vars.OVH_SFTP_USER }}
        run: |
          if [ -z "$OVH_SFTP_PASSWORD" ]; then
            echo "::error::OVH_SFTP_PASSWORD is missing on both the production-ovh and production-ovh-auto environments (whichever this run resolved to). Run: gh secret set OVH_SFTP_PASSWORD --env production-ovh-auto" >&2
            exit 1
          fi
          for name in OVH_SFTP_HOST OVH_SFTP_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set. Run: gh variable set $name --body '<value from the OVH Control Panel, FTP - SSH>'" >&2
              exit 1
            fi
          done

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ovh-dist
          path: dist

      - name: Download Studio artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ovh-studio-dist
          path: studio-dist

      # Pinned to the immutable commit SHA (v1.2.6), never a tag or branch:
      # this is a Docker action that builds and runs third-party code on
      # this runner while OVH_SFTP_PASSWORD is in scope, so a mutable tag
      # would be an exfiltration path if the upstream tag were ever
      # force-moved. sftp_only: true is required because OVH's mutualized
      # tier has no SSH shell (Professional tier and up only) — without it
      # the action's `ssh … mkdir -p` step would fail. delete_remote_files
      # is deliberately left unset (default false): setting it true would
      # attempt `ssh … rm -rf` on a host with no shell.
      - name: Deploy dist to OVH (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ vars.OVH_SFTP_USER }}
          server: ${{ vars.OVH_SFTP_HOST }}
          port: '22'
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/home/${{ vars.OVH_SFTP_USER }}/www'
          sftp_only: true

      # The previous step's ./dist/* glob cannot match dotfiles, so
      # Apache's config has to be sent by explicit path. The build job's
      # "only .htaccess is a top-level dotfile" guard proves this is the
      # only dotfile that needs this treatment.
      - name: Deploy .htaccess to OVH (SFTP, dotfile)
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ vars.OVH_SFTP_USER }}
          server: ${{ vars.OVH_SFTP_HOST }}
          port: '22'
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './dist/.htaccess'
          remote_path: '/home/${{ vars.OVH_SFTP_USER }}/www'
          sftp_only: true

      # The Studio lives in its own remote folder (www/studio), so the site
      # upload above never overwrites it and vice versa.
      - name: Deploy Studio to OVH (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ vars.OVH_SFTP_USER }}
          server: ${{ vars.OVH_SFTP_HOST }}
          port: '22'
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './studio-dist/*'
          remote_path: '/home/${{ vars.OVH_SFTP_USER }}/www/studio'
          sftp_only: true

      - name: Deploy Studio .htaccess to OVH (SFTP, dotfile)
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ vars.OVH_SFTP_USER }}
          server: ${{ vars.OVH_SFTP_HOST }}
          port: '22'
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './studio-dist/.htaccess'
          remote_path: '/home/${{ vars.OVH_SFTP_USER }}/www/studio'
          sftp_only: true

      - name: Deploy complete
        run: |
          {
            echo "## OVH production deploy complete"
            echo ""
            echo "Files pushed to the OVH hosting plan configured in the repository variables."
            echo ""
            echo "The files are live at https://atelierjacquelinesuzanne.fr. This workflow never touches DNS."
          } >> "$GITHUB_STEP_SUMMARY"
