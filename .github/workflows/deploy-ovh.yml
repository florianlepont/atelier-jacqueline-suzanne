name: Deploy to OVH production

# This is the ONLY path that ever writes to the real production domain,
# atelierjacquelinesuzanne.fr, served from OVH Web Hosting. It now has two
# trigger paths:
#
#   - A Sanity content publish fires the `sanity-content-published`
#     repository_dispatch event, which starts this workflow automatically
#     and deploys straight through with no approval pause — a deliberate,
#     dated supersession of D-01 (see
#     .planning/phases/05-launch-domain-cutover/05-CONTEXT.md), made
#     because the non-technical maintainer has no GitHub access and could
#     not otherwise publish content to the real domain.
#   - Every other trigger (a manual `workflow_dispatch`) still pauses on
#     the `production-ovh` environment's Required reviewer, per D-02,
#     exactly as before.
#
# A code commit landing on `main` still deploys ONLY to GitHub Pages
# staging via .github/workflows/deploy.yml, which this workflow does not
# touch and does not share a trigger with.
#
# Because `repository_dispatch` always runs against the default branch,
# an automatic content deploy also ships whatever code is currently on
# `main` — treat `main` as always production-ready.
#
# The `deploy` job below is gated on a trigger-conditional GitHub
# Environment. With a Required reviewer configured on `production-ovh`,
# GitHub pauses manual runs after the `build` job's recap is printed and
# requires a recorded human approval before the SFTP push can happen
# (D-02); `production-ovh-auto` carries no such gate. See README.md
# "Deployments" section for the one-time setup and the run procedure.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [sanity-content-published]

permissions:
  contents: read

# Only one production push should ever be in flight/queued — two
# interleaved pushes to the same remote directory would race. This same
# `ovh-production` group with `cancel-in-progress: false` now also
# serialises automatic runs: a burst of Sanity publishes queues rather
# than racing, and GitHub keeps only the most recent pending run — which
# is the desired latest-content-wins behaviour.
concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sanity/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Sanity Studio dependencies
        run: npm ci --prefix sanity

      - name: Lint and build Sanity Studio
        run: |
          npm --prefix sanity run lint
          npm --prefix sanity run build

      # BLOCKING gate, same as staging: a type error inside .astro
      # frontmatter (or any .ts source) fails the run before any build
      # is attempted.
      - name: Type-check (astro check)
        run: npm run typecheck

      # Production build: root base path (OVH serves the domain root, so
      # the base-path env var used by the GitHub Pages build is
      # deliberately left UNSET here — setting it would make every baked
      # href/asset path wrong on the real domain) and an explicit
      # SITE_URL pointing at the real domain. A missing SITE_URL here is
      # the failure mode that silently ships canonical tags, hreflang
      # links, sitemap.xml, and robots.txt all pointing back at the
      # GitHub Pages host. PUBLIC_CONTACT_ENDPOINT is deliberately left
      # UNSET too: production is same-origin with contact.php, so the
      # contact-form helper's default (/contact.php) is already correct.
      - name: Build (OVH production artifact, root base)
        run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SITE_URL: https://atelierjacquelinesuzanne.fr

      # BLOCKING gate: proves the root-base artifact is well-formed, and
      # (per 05-01-PLAN.md) also proves dist/contact.php and the hardened
      # dist/.htaccess shipped with matching honeypot field names.
      - name: Verify static artifact
        run: npm run test:artifact

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # OS-level browser deps are not stored in ~/.cache/ms-playwright, so
      # they must still be installed even when the browser binary cache hits.
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # BLOCKING gate: the production path never skips a gate the staging
      # path enforces.
      - name: Run Playwright e2e tests
        run: npx playwright test

      # BLOCKING gate.
      - name: Run Vitest unit tests with coverage thresholds
        run: npm run test:coverage

      # The SFTP step below uploads dotfiles by explicit name (see the
      # "Deploy .htaccess" step in the deploy job), because a shell glob
      # like ./dist/* silently skips them. This guard turns "a new
      # top-level dotfile appeared and would be silently dropped from
      # production" into a loud build failure instead of a silent gap.
      - name: 'Guard: only .htaccess is a top-level dotfile'
        run: |
          dotfiles=$(find dist -maxdepth 1 -mindepth 1 -name '.*' -printf '%f\n' | sort)
          expected='.htaccess'
          if [ "$dotfiles" != "$expected" ]; then
            echo "::error::Expected dist/ to contain exactly one top-level dotfile (.htaccess), found: $(echo "$dotfiles" | tr '\n' ' ')" >&2
            exit 1
          fi

      # This recap is the artifact a human reads before approving the
      # `deploy` job's environment gate (D-02) — it is already visible in
      # the same run, above the Approve/Reject button.
      - name: Deploy recap
        run: |
          {
            echo "## OVH production deploy recap"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA}\` — $(git log -1 --pretty=%s)"
            echo "- **Target host:** \`ftp.cluster129.hosting.ovh.net\`"
            echo "- **Remote path:** \`/home/atelihu/www\`"
            echo "- **Resolved SITE_URL:** \`https://atelierjacquelinesuzanne.fr\`"
            echo "- **File count:** $(find dist -type f | wc -l)"
            echo "- **Total size:** $(du -sh dist | cut -f1)"
            echo ""
            echo "### Top-level dist/ entries"
            echo '```'
            ls -1a dist
            echo '```'
            echo ""
            if [ -f dist/contact.php ]; then
              echo "- dist/contact.php: present"
            else
              echo "- dist/contact.php: **MISSING**"
            fi
            if [ -f dist/.htaccess ]; then
              echo "- dist/.htaccess: present"
            else
              echo "- dist/.htaccess: **MISSING**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact@v4.4+ excludes hidden files by default.
      # Without include-hidden-files: true, dist/.htaccess never even
      # reaches the deploy job, and production ships with no Apache
      # config (no ErrorDocument, no Options -Indexes, no HTTPS redirect).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovh-dist
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub environment protection rules are a property of the
    # environment, not the job, so a conditional approval gate requires
    # two environments: `production-ovh` carries the Required reviewer
    # and gates manual runs (D-02), while `production-ovh-auto` is
    # deliberately created with no protection rules so Sanity-content
    # runs deploy straight through. Environment secrets do not cross
    # environments, so `OVH_SFTP_PASSWORD` must exist on BOTH (see
    # README.md "Deployments").
    environment:
      name: ${{ github.event_name == 'repository_dispatch' && 'production-ovh-auto' || 'production-ovh' }}
      url: https://atelierjacquelinesuzanne.fr
    steps:
      # Without this, a missing environment secret resolves to an empty
      # string and the SFTP action attempts an unauthenticated
      # connection, producing an opaque failure. This turns that into a
      # loud, actionable one before any upload is attempted.
      - name: 'Guard: SFTP credentials are present'
        env:
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          if [ -z "$OVH_SFTP_PASSWORD" ]; then
            echo "::error::OVH_SFTP_PASSWORD is missing on both the production-ovh and production-ovh-auto environments (whichever this run resolved to). Run: gh secret set OVH_SFTP_PASSWORD --env production-ovh-auto" >&2
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ovh-dist
          path: dist

      # One-time launch workaround (2026-08-11): OVH provisioned a default
      # placeholder index.html in /home/atelihu/www when the domain was
      # attached via Multisite. Two prior manual-approval runs both failed
      # identically on "dest open .../index.html: Failure" while every
      # other file in the same recursive put succeeded — a stale-file
      # conflict, not a transient network error. This step removes only
      # that single known path via the plain SFTP protocol (no shell —
      # matches the sftp_only constraint above) before the real upload.
      # continue-on-error: true because this is best-effort cleanup; the
      # real proof is whether the next step's upload succeeds. Safe to
      # remove once the first successful production deploy confirms the
      # stale file is gone for good.
      - name: 'Workaround: remove stale OVH default index.html'
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=no -P 22 atelihu@ftp.cluster129.hosting.ovh.net <<'EOF'
          ls -la /home/atelihu/www/index.html
          rm /home/atelihu/www/index.html
          EOF

      # Pinned to the immutable commit SHA (v1.2.6), never a tag or branch:
      # this is a Docker action that builds and runs third-party code on
      # this runner while OVH_SFTP_PASSWORD is in scope, so a mutable tag
      # would be an exfiltration path if the upstream tag were ever
      # force-moved. sftp_only: true is required because OVH's mutualized
      # tier has no SSH shell (Professional tier and up only) — without it
      # the action's `ssh … mkdir -p` step would fail. delete_remote_files
      # is deliberately left unset (default false): setting it true would
      # attempt `ssh … rm -rf` on a host with no shell.
      - name: Deploy dist to OVH (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: atelihu
          server: ftp.cluster129.hosting.ovh.net
          port: '22'
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/home/atelihu/www'
          sftp_only: true

      # The previous step's ./dist/* glob cannot match dotfiles, so
      # Apache's config has to be sent by explicit path. The build job's
      # "only .htaccess is a top-level dotfile" guard proves this is the
      # only dotfile that needs this treatment.
      - name: Deploy .htaccess to OVH (SFTP, dotfile)
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: atelihu
          server: ftp.cluster129.hosting.ovh.net
          port: '22'
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './dist/.htaccess'
          remote_path: '/home/atelihu/www'
          sftp_only: true

      - name: Deploy complete
        run: |
          {
            echo "## OVH production deploy complete"
            echo ""
            echo "Files pushed to \`atelihu@ftp.cluster129.hosting.ovh.net:/home/atelihu/www\`."
            echo ""
            echo "DNS is unchanged by this workflow — files are now on the server, but the domain does not point at this hosting until the separate manual DNS cutover runs."
          } >> "$GITHUB_STEP_SUMMARY"
