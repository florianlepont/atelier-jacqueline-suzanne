name: Build, test, and deploy to GitHub Pages

# Phase 1 staging deploy target (rescoped per 01-CONTEXT.md D-12): OVH's Free
# hosting tier cannot attach a staging subdomain at all, so Phase 1's public
# staging URL is a GitHub Pages project page instead. Production cutover to
# the real OVH-hosted domain is a separate Phase 5 plan, using the SFTP facts
# recorded in 01-02-SUMMARY.md — this workflow deploys ONLY to GitHub Pages.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-content-published]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy should be in flight/queued at a time for GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies, lint, and type-check
        uses: ./.github/actions/lint-typecheck-and-install

      # Build once WITHOUT the GitHub Pages base path so the existing
      # Playwright/Vitest suite (which asserts root-relative paths like "/"
      # and "/en/", matching local dev) can hard-gate the deploy without
      # needing to know about the deployed base prefix. This build's dist/
      # output is discarded — it exists only to produce a testable artifact.
      # (Astro's `base` only rewrites baked-in href/asset strings; it does
      # not change app behavior, so this build is behaviorally equivalent to
      # the GitHub-Pages-base build produced later in this job.)
      - name: Build (test artifact, root base)
        run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      - name: Verify root static artifact
        run: npm run test:artifact

      - name: Playwright e2e and Vitest coverage
        uses: ./.github/actions/e2e-and-unit-tests

      # Rebuild WITH the GitHub Pages project-page base path so all baked
      # href/asset URLs in the deployed artifact are subpath-correct. This is
      # the build that actually gets published.
      - name: Build (deploy artifact, GitHub Pages base)
        run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          ASTRO_BASE: /atelier-jacqueline-suzanne/
          # GitHub Pages has no PHP runtime and is served from a different
          # origin than production, so this staging build must POST
          # cross-origin to the real contact.php endpoint (D-03: this
          # environment stays alive permanently as pre-production).
          PUBLIC_CONTACT_ENDPOINT: https://atelierjacquelinesuzanne.fr/contact.php

      # WR-04: regression guard for the exact bug class that shipped as
      # CR-01 — a hardcoded root-relative link (unrelated to the switcher
      # utility, so no unit test would catch it) that bypassed the base
      # path entirely. Any bare href="/" or href="/en/" in this base-prefixed
      # build is wrong by construction: every real link on this site must go
      # through an Astro i18n URL helper, which always emits the configured
      # base ("/atelier-jacqueline-suzanne/..." here, never a bare root-relative path).
      - name: Check for un-prefixed links (base-path regression guard)
        run: |
          if grep -rE 'href="/"|href="/en/"' dist/; then
            echo "::error::Found a hardcoded root-relative href that bypasses the GitHub Pages base path (see 01-REVIEW.md CR-01/WR-04). Use an astro:i18n URL helper instead of a literal string." >&2
            exit 1
          fi

      - name: Verify GitHub Pages static artifact
        run: npm run test:artifact
        env:
          EXPECTED_BASE: /atelier-jacqueline-suzanne/

      # GitHub Pages has no PHP runtime, so it would otherwise serve
      # contact.php as a downloadable source file at
      # https://florianlepont.github.io/atelier-jacqueline-suzanne/contact.php, publishing
      # the endpoint's internals. This is production-only (05-01-PLAN.md
      # Task 3C) and runs after artifact verification so that step still
      # sees the file, but before the artifact is uploaded/published.
      - name: Strip the PHP endpoint from the Pages artifact
        run: rm -f dist/contact.php

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Closes the manual-publish gap diagnosed in
      # .planning/debug/resolved/preprod-site-404-after-rename.md: the hosted
      # Studio previously had no CI path and could only be refreshed by
      # someone running `sanity deploy` by hand — which had already gone
      # stale once (a dead pre-rename GitHub Pages URL baked into the live
      # Studio's "Voir sur le site" button).
      #
      # Runs on every push to `main`, not only pushes touching `sanity/`
      # (D-02): the Studio's SITE_PREVIEW_URL depends on this workflow's own
      # base path too, so a `sanity/**` paths filter would reintroduce the
      # exact staleness risk this step exists to remove. It intentionally
      # does NOT run on the repository_dispatch content-publish event, since
      # a content publish cannot change Studio source code.
      #
      # Last step in the job (D-01): the Studio links to the site that must
      # already be live, and this position inherits every blocking gate
      # (Studio lint/coverage/build/typecheck, root lint/typecheck, both
      # artifact verifications, Playwright, Vitest coverage) for free.
      #
      # If SANITY_AUTH_TOKEN is missing, this step warns and exits 0 instead
      # of failing the run (D-03) — deliberately different from the
      # fail-loud `Guard: SFTP credentials are present` step in
      # deploy-ovh.yml. That guard protects an irreversible production
      # upload; this one protects an idempotent, re-runnable Studio publish
      # that cannot be set up until this workflow change has already landed
      # (Claude cannot create repository secrets). Once the secret exists, a
      # genuine publish failure still fails the run loudly.
      - name: Publish the hosted Sanity Studio
        if: github.event_name == 'push'
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "${SANITY_AUTH_TOKEN}" ]; then
            echo "::warning::SANITY_AUTH_TOKEN repository secret is not set — skipping hosted Sanity Studio publish. Add it under repo Settings > Secrets and variables > Actions (see README.md for setup steps)."
            exit 0
          fi
          npm --prefix sanity run deploy
