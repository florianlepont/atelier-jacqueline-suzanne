<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Variant A: Baseline — Detail</title>
<link rel="stylesheet" href="../../themes/default.css" />
<style>
  @view-transition {
    navigation: auto;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-md) var(--space-lg);
  }
  .logo { font-family: var(--font-display); font-weight: var(--weight-black); font-size: 20px; color: var(--gray-0); }
  nav { display: flex; gap: var(--space-lg); font-size: 14px; }
  nav a { color: var(--gray-0); }

  .hero {
    position: relative; height: 100vh; overflow: hidden; background: var(--color-ink);
  }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0) 70%); }
  .hero-title {
    position: absolute; left: var(--space-lg); bottom: var(--space-lg); color: #fff;
    font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: clamp(32px, 5vw, 56px); margin: 0;
  }
  .back { position: fixed; top: 20px; right: 20px; z-index: 20; color: #fff; font-size: 13px; background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="hero">
    <img id="heroImg" src="" alt="" />
    <div class="hero-scrim"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
  </div>
  <header>
    <span class="logo">AJS</span>
    <nav><a href="#">Éditions</a><a href="#">À propos</a><a href="#">Contact</a></nav>
  </header>
  <a class="back" href="grid.html">← Retour</a>

  <div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.7);color:white;padding:8px 12px;border-radius:8px;opacity:0.4;transition:opacity 0.2s;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.4'">
    sketch 006 · A: baseline
  </div>

  <script>
    const PHOTOS = {
      '1': { src: 'https://cdn.sanity.io/images/gwz8iug4/production/6b189c54db97dd6f9d29846f3ef0c75cdbf882d4-5742x3828.jpg?w=2000&auto=format', title: 'Silos' },
      '2': { src: 'https://cdn.sanity.io/images/gwz8iug4/production/5ce383b9109bb57310e009b85ca4008995cb4831-5735x3783.jpg?w=2000&auto=format', title: 'Brume' },
      '3': { src: 'https://cdn.sanity.io/images/gwz8iug4/production/a74307df39a8fc5507cc2cf5d5cafb700af09ca9-6414x4786.jpg?w=2000&auto=format', title: 'Paysage' },
    };
    const p = new URLSearchParams(location.search).get('p') || '1';
    const photo = PHOTOS[p] || PHOTOS['1'];
    document.getElementById('heroImg').src = photo.src;
    document.getElementById('heroTitle').textContent = photo.title;
  </script>
</body>
</html>
