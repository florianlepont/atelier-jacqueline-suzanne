<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Variant B: Photo Morph — Grid</title>
<link rel="stylesheet" href="../../themes/default.css" />
<style>
  @view-transition {
    navigation: auto;
  }

  body { padding-top: 0; }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-md) var(--space-lg);
  }
  .logo { font-family: var(--font-display); font-weight: var(--weight-black); font-size: 20px; color: var(--gray-0); }
  nav { display: flex; gap: var(--space-lg); font-size: 14px; }
  nav a { color: var(--gray-0); }

  .hero-strip {
    background: var(--color-ink);
    padding: 96px var(--space-lg) var(--space-lg);
  }
  .kicker { color: rgba(255,255,255,0.6); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 8px; }
  h1 { font-family: var(--font-display); color: var(--gray-0); font-size: clamp(28px, 4vw, 44px); margin: 0 0 var(--space-lg); }

  .tiles {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md);
    padding: 0 var(--space-lg) var(--space-2xl);
  }
  .tile { position: relative; display: block; aspect-ratio: 3/4; overflow: hidden; background: var(--color-ink); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile-title {
    position: absolute; left: var(--space-md); bottom: var(--space-md); color: #fff;
    font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: 18px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="hero-strip">
    <header>
      <span class="logo">AJS</span>
      <nav><a href="#">Éditions</a><a href="#">À propos</a><a href="#">Contact</a></nav>
    </header>
    <p class="kicker">Variant B — Photo morph (named shared element)</p>
    <h1>Collections</h1>
  </div>
  <div class="tiles">
    <a class="tile" href="detail.html?p=1">
      <img src="https://cdn.sanity.io/images/gwz8iug4/production/6b189c54db97dd6f9d29846f3ef0c75cdbf882d4-5742x3828.jpg?w=900&auto=format" alt="" />
      <span class="tile-title">Silos</span>
    </a>
    <a class="tile" href="detail.html?p=2">
      <img src="https://cdn.sanity.io/images/gwz8iug4/production/5ce383b9109bb57310e009b85ca4008995cb4831-5735x3783.jpg?w=900&auto=format" alt="" />
      <span class="tile-title">Brume</span>
    </a>
    <a class="tile" href="detail.html?p=3">
      <img src="https://cdn.sanity.io/images/gwz8iug4/production/a74307df39a8fc5507cc2cf5d5cafb700af09ca9-6414x4786.jpg?w=900&auto=format" alt="" />
      <span class="tile-title">Paysage</span>
    </a>
  </div>

  <div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.7);color:white;padding:8px 12px;border-radius:8px;opacity:0.4;transition:opacity 0.2s;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.4'">
    sketch 006 · B: photo morph · <a href="../variant-a-baseline/grid.html" style="color:#fff">A</a> · <a href="../variant-c-chrome-persist/grid.html" style="color:#fff">C</a>
  </div>

  <script>
    // quick-260724-* precedent (Lightbox.astro's open()): set
    // view-transition-name imperatively on the SPECIFIC clicked element
    // right before navigation — never statically on every tile, since
    // view-transition-name must be unique per document at capture time.
    // No startViewTransition()/feature-detect call needed here: this is a
    // real <a href> navigation, and @view-transition{navigation:auto} is
    // pure CSS — unsupported browsers just ignore it and navigate normally.
    document.querySelectorAll('.tile').forEach((tile) => {
      tile.addEventListener('click', () => {
        const img = tile.querySelector('img');
        if (img) img.style.viewTransitionName = 'hero-photo';
      });
    });
  </script>
</body>
</html>
